site_name: "Datenbanken (Kurs 3019) – Mechatronik/Automatisierung"
docs_dir: docs
site_dir: site

theme:
  name: material
  language: de
  features:
    - navigation.sections
    - content.code.copy

hooks:
  - hooks/publish_scheduler.py

plugins:
  - search
  - mkdocs_quiz

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - def_list

exclude_docs: |
  01-praxisphase/_template/
  02-theoriephase/_templates/
  00-projektsteuerung/stundenplan.md

extra_css:
  - stylesheets/extra.css

nav:
  - Start: index.md
  - Glossar: glossar.md
  - Praxisphase:
      - "Woche 1": 01-praxisphase/woche-01/woche-01.md
      - "Woche 2": 01-praxisphase/woche-02/woche-02.md
      - "Woche 3": 01-praxisphase/woche-03/woche-03.md