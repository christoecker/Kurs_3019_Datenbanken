site_name: "Datenbanken (Kurs 3019) – Mechatronik/Automatisierung"
docs_dir: docs
site_dir: site
copyright: "© 2026 Christian Stöcker · Hochschule Bielefeld · Datenbanken (Kurs 3019) · Wintersemester 2026/27"

theme:
  name: material
  language: de
  favicon: assets/favicon.svg
  icon:
    logo: material/database
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.indexes
    - content.code.copy
    - content.code.annotate

extra:
  generator: false

hooks:
  - hooks/publish_scheduler.py
  - hooks/solution_toggle.py

plugins:
  - search
  - mkdocs_quiz

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: ["docs"]
      check_paths: true
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - def_list
  - tables

exclude_docs: |
  01-praxisphase/_template/
  02-theoriephase/_templates/
  02-theoriephase/_skript-werkzeuge/
  02-theoriephase/termin-*/skript/
  02-theoriephase/termin-*/intern/
  00-projektsteuerung/stundenplan.md
  02-theoriephase/termin-07-twincat-sps/

extra_css:
  - stylesheets/extra.css?v=20261022b

nav:
  - Start: index.md
  - Info:
      - "Ablauf der Veranstaltung": info/ablauf.md
      - Glossar: glossar.md
      - "SQL Server und Lehrbrief": info/sql-server-vs-lehrbrief.md
      - Fehlerbildkatalog: info/fehlerbildkatalog.md
  - Theoriephase:
      - "Termin 1":
          - 02-theoriephase/termin-01/index.md
          - "ER-Modell aufstellen": 02-theoriephase/termin-01/block-01.md
          - "Transformation ins Relationenmodell": 02-theoriephase/termin-01/block-02.md
      - "Termin 2":
          - 02-theoriephase/termin-02/index.md
          - "Normalisierung anwenden": 02-theoriephase/termin-02/block-03.md
          - "Relationenschema in SQL Server anlegen": 02-theoriephase/termin-02/block-04.md
      - "Termin 3":
          - 02-theoriephase/termin-03/index.md
          - "SQL-Abfragen mit BestTec": 02-theoriephase/termin-03/block-05.md
          - "Eigene Abfragen und Datenänderung": 02-theoriephase/termin-03/block-06.md
      - "Termin 4":
          - 02-theoriephase/termin-04/index.md
          - "Zugriffsrechte und Benutzerverwaltung": 02-theoriephase/termin-04/block-07.md
          - "Prozeduren und Trigger": 02-theoriephase/termin-04/block-08.md
      - "Termin 5":
          - 02-theoriephase/termin-05/index.md
          - "Mini-Projekt: Ticketsystem Instandhaltung": 02-theoriephase/termin-05/block-09-10.md
  - Praxisphase:
      - "Woche 1": 01-praxisphase/woche-01/woche-01.md
      - "Woche 2": 01-praxisphase/woche-02/woche-02.md
      - "Woche 3": 01-praxisphase/woche-03/woche-03.md
      - "Woche 4": 01-praxisphase/woche-04/woche-04.md
      - "Woche 5": 01-praxisphase/woche-05/woche-05.md
      - "Woche 6": 01-praxisphase/woche-06/woche-06.md
      - "Woche 7": 01-praxisphase/woche-07/woche-07.md
      - "Woche 8": 01-praxisphase/woche-08/woche-08.md
      - "Woche 9": 01-praxisphase/woche-09/woche-09.md
      - "Woche 10": 01-praxisphase/woche-10/woche-10.md
      - "Woche 11": 01-praxisphase/woche-11/woche-11.md
      - "Woche 12": 01-praxisphase/woche-12/woche-12.md
  